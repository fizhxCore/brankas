name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Flutter project (generates android/ fresh)
        run: flutter create --platforms=android --org com.yiwa.brankas app

      - name: Overlay project source into scaffold
        run: |
          cp source/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r source/lib app/lib

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brankas-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
