name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Flutter project (generates android/ fresh)
        run: flutter create --platforms=android --org com.yiwa.brankas app

      - name: Overlay project source into scaffold
        run: |
          cp source/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r source/lib app/lib

      - name: Bump compileSdk/targetSdk (file_picker requires 36+)
        working-directory: app
        run: |
          KTS=android/app/build.gradle.kts
          GROOVY=android/app/build.gradle
          if [ -f "$KTS" ]; then
            sed -i -E 's/^([[:space:]]*)compileSdk[[:space:]]*=.*/\1compileSdk = 36/' "$KTS"
            sed -i -E 's/^([[:space:]]*)targetSdk[[:space:]]*=.*/\1targetSdk = 36/' "$KTS"
            echo "--- $KTS after patch ---"
            grep -n "compileSdk\|targetSdk" "$KTS"
          fi
          if [ -f "$GROOVY" ]; then
            sed -i -E 's/^([[:space:]]*)compileSdkVersion[[:space:]]+.*/\1compileSdkVersion 36/' "$GROOVY"
            sed -i -E 's/^([[:space:]]*)targetSdkVersion[[:space:]]+.*/\1targetSdkVersion 36/' "$GROOVY"
            echo "--- $GROOVY after patch ---"
            grep -n "compileSdkVersion\|targetSdkVersion" "$GROOVY"
          fi

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brankas-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
